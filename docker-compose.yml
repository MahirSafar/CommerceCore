services:
  postgres:
    image: postgres:18.6
    container_name: commercecore-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: CommerceCore
      POSTGRES_PASSWORD: Commerce123!
      POSTGRES_DB: CommerceCoreDb

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4:9.17
    container_name: commercecore-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@commercecore.com
      PGADMIN_DEFAULT_PASSWORD: Admin123!

    ports:
      - "5050:80"

    volumes:
      - pgadmin_data:/var/lib/pgadmin

    depends_on:
      - postgres

volumes:
  postgres_data:
  pgadmin_data: