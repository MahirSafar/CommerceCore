name: CommerceCore CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore NuGet Packages
        run: dotnet restore CommerceCore.slnx

      - name: Build Solution (Release Mode)
        run: dotnet build CommerceCore.slnx --no-restore --configuration Release

      - name: Verify C# formatting
        run: dotnet format CommerceCore.slnx --verify-no-changes --no-restore --severity warn

      - name: Restore local .NET tools
        run: dotnet tool restore

      - name: Verify EF Core migration model is current
        env:
          DOTNET_ENVIRONMENT: Development
          COMMERCECORE_MIGRATIONS_CONNECTION_STRING: Host=localhost;Port=5432;Database=commercecore_ci;Username=postgres;Password=postgres
        run: >
          dotnet ef migrations has-pending-model-changes
          --project src/Infrastructure/CommerceCore.Persistence/CommerceCore.Persistence.csproj
          --startup-project src/Presentation/CommerceCore.Api/CommerceCore.Api.csproj
          --configuration Release
          --no-build

      - name: Build API container image
        run: docker build --tag commercecore-api:ci .

      - name: Run complete test suite
        run: dotnet test CommerceCore.slnx --no-build --configuration Release --verbosity normal
